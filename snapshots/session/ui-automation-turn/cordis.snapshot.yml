# Keyless replay retains the semantic UI composition and replaces only the model adapter.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: ui-automation-snapshot-provider
      name: './ui-automation-snapshot-provider.mjs'
    - id: tool-ui-automation
      name: '@deepseek-ai/dsh-tool-ui-automation'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
